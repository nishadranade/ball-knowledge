name: CI

# Runs on pull requests (and pushes to non-main branches) so every PR gets an
# automated pass/fail before review. It does NOT deploy — deploy.yml handles that
# on merge to main. Ships the committed public/data/*.json (no live data fetch).

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:app
